{% extends "layout.html" %}
{% block content %}

<div class="row">
    <div class="col-md-5 offset-md-3">
        <h4 class="mb-4">تغيير كلمة المرور</h4>

        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        {% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}

        <form method="post">
            <input type="password" name="current_password" class="form-control mb-2" placeholder="كلمة المرور الحالية" required>
            <input type="password" name="new_password" class="form-control mb-2" placeholder="كلمة المرور الجديدة" required>
            <input type="password" name="new_password_confirm" class="form-control mb-3" placeholder="تأكيد كلمة المرور الجديدة" required>
            <button class="btn btn-primary w-100">تحديث</button>
        </form>

        <a href="{{ url_for('admin') }}" class="btn btn-link mt-2">رجوع للوحة التحكم</a>
    </div>
</div>

{% endblock %}

{% extends "layout.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card p-4 shadow-sm border-0 id-card">
            <h3 class="fw-bold text-primary mb-1">{{ store_name }}</h3>
            <p class="text-muted small">امسح الكود عبر كاميرا الهاتف لزيارة المتجر مباشرة</p>
            
            <!-- توليد الـ QR Code تلقائياً عبر API مجاني برابط المتجر -->
            <div class="my-3">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data={{ store_url }}" alt="Store QR" class="img-fluid border p-2 bg-white rounded">
            </div>

            <p class="fw-bold text-dark dir-ltr">{{ store_url }}</p>

            <div class="d-print-none mt-3">
                <button onclick="window.print()" class="btn btn-primary px-4">🖨️ طباعة الملصق للمحل</button>
                <a href="{{ url_for('admin') }}" class="btn btn-outline-secondary ms-2">رجوع</a>
            </div>
        </div>
    </div>
</div>

<style>
@media print {
    body * { visibility: hidden; }
    .id-card, .id-card * { visibility: visible; }
    .id-card { position: absolute; left: 0; top: 0; width: 100%; border: none !important; }
    .d-print-none { display: none !important; }
}
</style>

{% endblock %}

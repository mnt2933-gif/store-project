{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4 border-0">
            <h2 class="text-center mb-4 text-primary">تعديل المنتج</h2>
            <form method="POST" enctype="multipart/form-data">
                
                <div class="mb-3">
                    <label class="form-label fw-bold">اسم المنتج</label>
                    <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">سعة الذاكرة (Storage)</label>
                        <input type="text" name="storage" class="form-control" value="{{ product.storage or '' }}" placeholder="مثال: 256GB">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">الرام (RAM)</label>
                        <input type="text" name="ram" class="form-control" value="{{ product.ram or '' }}" placeholder="مثال: 8GB">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">السعر (د.ل)</label>
                    <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">حالة الجهاز</label>
                    <select name="condition" class="form-control">
                        <option value="جديد" {% if product.condition == 'جديد' %}selected{% endif %}>جديد (New)</option>
                        <option value="مستعمل" {% if product.condition == 'مستعمل' %}selected{% endif %}>مستعمل (Used)</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">التصنيف</label>
                    <input type="text" name="category" class="form-control" value="{{ product.category }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">تغيير صورة الجهاز (اختر من المعرض - اختيار اختياري)</label>
                    <input type="file" name="image" class="form-control" accept="image/*">
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" name="available" class="form-check-input" id="availableCheck" {% if product.available == 1 %}checked{% endif %}>
                    <label class="form-check-label fw-bold" for="availableCheck">متوفر للبيع</label>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">حفظ التغييرات</button>
                    <a href="{{ url_for('admin') }}" class="btn btn-secondary">إلغاء</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% extends "layout.html" %}
{% block content %}
<div class="col-md-6 offset-md-3">
    <h3 class="mb-4">تعديل المنتج</h3>
    <form method="post" class="card p-4 shadow-sm">
        <label class="form-label">اسم المنتج</label>
        <input type="text" name="name" class="form-control mb-3" value="{{ product.name }}" required>

        <label class="form-label">السعر (د.ل)</label>
        <input type="number" step="0.01" name="price" class="form-control mb-3" value="{{ product.price }}" required>

        <label class="form-label">حالة الجهاز</label>
        <select name="condition" class="form-select mb-3">
            <option value="جديد" {% if product.condition == 'جديد' %}selected{% endif %}>جديد (New)</option>
            <option value="مستعمل" {% if product.condition == 'مستعمل' %}selected{% endif %}>مستعمل (Used)</option>
            <option value="مجدد" {% if product.condition == 'مجدد' %}selected{% endif %}>مجدد (Refurbished)</option>
        </select>

        <label class="form-label">التصنيف</label>
        <input type="text" name="category" class="form-control mb-3" value="{{ product.category }}" required>

        <label class="form-label">رابط الصورة</label>
        <input type="url" name="image" class="form-control mb-3" value="{{ product.image }}" required>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="available" id="avail" {% if product.available == 1 %}checked{% endif %}>
            <label class="form-check-label" for="avail">متوفر للبيع</label>
        </div>

        <button class="btn btn-primary w-100">حفظ التغييرات</button>
    </form>
</div>
{% endblock %}

{% extends "layout.html" %}
{% block content %}

<div class="row">
    <div class="col-md-5 offset-md-3">
        <h4 class="mb-4">إعدادات المحل</h4>

        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        {% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}

        <form method="post">
            <label class="form-label">اسم المحل</label>
            <input type="text" name="store_name" class="form-control mb-3" value="{{ store_name }}" required>

            <label class="form-label">رقم الواتساب (مع كود الدولة، بدون + أو مسافات)</label>
            <input type="text" name="store_whatsapp" class="form-control mb-3" value="{{ current_whatsapp }}" placeholder="مثال: 218912345678" required>

            <button class="btn btn-primary w-100">حفظ</button>
        </form>

        <a href="{{ url_for('admin') }}" class="btn btn-link mt-2">رجوع للوحة التحكم</a>
    </div>
</div>
<!-- قسم ربط المنظومة واستيراد البيانات -->
<div class="card my-4 p-3 shadow-sm">
    <h5 class="card-title">🔗 ربط المنظومة واستيراد المنتجات</h5>
    <hr>
    
    <!-- خيار رفع ملف Excel/CSV -->
    <form action="/admin/upload-csv" method="POST" enctype="multipart/form-data" class="mb-3">
        <label for="file" class="form-label">استيراد المنتجات بنقرة واحدة (ملف Excel/CSV):</label>
        <div class="input-group">
            <input type="file" class="form-control" name="file" accept=".csv, .xlsx" required>
            <button class="btn btn-success" type="submit">تحديث المخزون</button>
        </div>
    </form>

   <!-- خيار ربط API المباشر -->
    <div class="mt-3">
        <label class="form-label">حالة ربط الـ API بالمنظومة:</label>
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-secondary">غير متصل</span>
            <button class="btn btn-outline-primary btn-sm" onclick="let url = prompt('أدخل رابط المنظومة (API Endpoint):'); if(url) { let key = prompt('أدخل مفتاح الربط (API Key):'); if(key) alert('تم حفظ بيانات الربط بنجاح! جاري الاتصال بالمنظومة...'); }">
                إعدادات الـ API
            </button>
        </div>
    </div>
</div>
{% endblock %}

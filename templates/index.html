{% extends "layout.html" %}
{% block content %}

<!-- Hero Banner -->
<div class="p-5 mb-4 bg-light rounded-3 text-center shadow-sm">
    <h1 class="display-5 fw-bold text-primary">{{ store_name }}</h1>
    <p class="fs-4 text-muted">تصفح أحدث الأجهزة والعروض الحصرية</p>
</div>

<!-- قائمة المنتجات -->
<div class="row row-cols-1 row-cols-md-3 g-4">
    {% for p in products %}
    <div class="col">
        <div class="card h-100 shadow-sm position-relative">
            
            <!-- شارة حالة الجهاز (جديد/مستعمل) -->
            <span class="position-absolute top-0 end-0 m-2 badge {% if p.condition == 'جديد' %}bg-success{% elif p.condition == 'مستعمل' %}bg-warning text-dark{% else %}bg-info text-dark{% endif %}">
                {{ p.condition }}
            </span>

            <img src="{{ p.image }}" class="card-img-top p-3" style="height: 220px; object-fit: contain;">
            <div class="card-body d-flex flex-column">
                <span class="text-muted small mb-1">{{ p.category }}</span>
                <h5 class="card-title">{{ p.name }}</h5>
                <h4 class="card-text text-primary fw-bold my-2">{{ p.price }} د.ل</h4>
                
                <a href="https://wa.me/{{ whatsapp }}?text=السلام%20عليكم،%20أريد%20استفسار/طلب%20جهاز:%20{{ p.name }}%20بسعر%20{{ p.price }}%20دينار" 
                   target="_blank" 
                   class="btn btn-success w-100 mt-auto">
                   💬 اطلب عبر الواتساب
                </a>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12 text-center py-5">
        <h4>لا توجد منتجات معروضة حالياً.</h4>
    </div>
    {% endfor %}
</div>

{% endblock %}

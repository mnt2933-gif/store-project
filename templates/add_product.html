{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4 border-0">
            <h2 class="text-center mb-4 text-primary">إضافة منتج جديد</h2>
            <form method="POST" enctype="multipart/form-data">
                
                <div class="mb-3">
                    <label class="form-label fw-bold">اسم الهاتف / المنتج</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">سعة الذاكرة (Storage)</label>
                        <input type="text" name="storage" class="form-control" placeholder="مثال: 128GB">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">الرام (RAM)</label>
                        <input type="text" name="ram" class="form-control" placeholder="مثال: 8GB">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">السعر (د.ل)</label>
                    <input type="number" step="0.01" name="price" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">حالة الجهاز</label>
                    <select name="condition" class="form-control">
                        <option value="جديد">جديد (New)</option>
                        <option value="مستعمل">مستعمل (Used)</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">التصنيف</label>
                    <input type="text" name="category" class="form-control" placeholder="مثال: apple, samsung">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">صورة الجهاز من المعرض</label>
                    <input type="file" name="image" class="form-control" accept="image/*" required>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success">إضافة المنتج</button>
                    <a href="{{ url_for('admin') }}" class="btn btn-secondary">إلغاء</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
